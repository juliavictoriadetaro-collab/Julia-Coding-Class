<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Social Media</title>

        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

        <!-- My CSS -->
        <link rel="stylesheet" href="style.css" />

        <!-- Font Awesome -->
        <script src="https://kit.fontawesome.com/996973c893.js"></script>

        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap" rel="stylesheet" />
    </head>

    <body>
        <!-- Navigation -->
        <div class="container navigation pt-3">
            <div class="row">

                <div class="col-6 d-flex justify-content-start align-items-center">
                    <i class="fas fa-utensils fa-2x text-warning pb-3"></i>
                    <h5 class="d-inline pl-2 text-white">RESTAURANT</h5>
                </div>

                <div class="col-6 pt-2">
                    <div class="row text-center p-0 d-flex justify-content-end align-items-center">

                        <div class="col-3">
                            <a href="about1.html" class="text-white navigation-link">
                                About
                            </a>
                        </div>

                        <div class="col-3">
                            <a href="projects1.html" class="text-white navigation-link">
                                Projects
                            </a>
                        </div>

                        <div class="col-3">
                            <a href="socialmedia1.html" class="text-white navigation-link">
                                Social Media
                            </a>
                        </div>

                        <div class="col-3">
                            <a href="https://packetcode.github.io/web-development-crash-course/resume-mini-project/"
                               target="_blank"
                               class="text-white navigation-link">
                                Resume
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!-- Social Media Section -->
        <div id="social-media" class="container-fluid">
            <div class="container text-white py-5">
                <h4 class="text-warning">Social Media</h4>
                <h1 class="m-heading">Let's be friends</h1>
                <div class="row pt-5">

                    <!-- LinkedIn -->
                    <div class="col-3 media_link btn">
                        <div class="row">
                            <div class="col-6 d-flex justify-content-start">
                                <h3 class="m-0 pt-2 text-white">
                                    LinkedIn
                                </h3>
                            </div>

                            <div class="col-6 d-flex justify-content-end align-items-center">
                                <i class="fab fa-linkedin-in fa-2x text-secondary"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Github -->
                    <div class="col-3 media_link btn">
                        <div class="row">
                            <div class="col-6 d-flex justify-content-start">
                                <h3 class="m-0 pt-2 text-white">
                                    Github
                                </h3>
                            </div>

                            <div class="col-6 d-flex justify-content-end align-items-center">
                                <i class="fab fa-github fa-2x text-secondary"></i>
                            </div>
                        </div>
                    </div>


                    <!-- Youtube -->
                    <div class="col-3 media_link btn">
                        <div class="row">
                            <div class="col-6 d-flex justify-content-start">
                                <h3 class="m-0 pt-2 text-white">
                                    <a href="https://www.youtube.com/@CodingalEducation"
                                       target="_blank"
                                       class="text-white">
                                        Youtube
                                    </a>
                                </h3>
                            </div>

                            <div class="col-6 d-flex justify-content-end align-items-center">
                                <i class="fab fa-youtube fa-2x text-secondary"></i>
                            </div>
                        </div>
                    </div>
                    <!-- Email -->
                    <div class="col-3 media_link bg-warning btn">

                        <div class="row">

                            <div class="col-6 d-flex justify-content-start">
                                <h3 class="m-0 pt-2 text-dark">
                                    Email
                                </h3>
                            </div>

                            <div class="col-6 d-flex justify-content-end align-items-center">
                                <i class="fas fa-envelope fa-2x text-secondary"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
