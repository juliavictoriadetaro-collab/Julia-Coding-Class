<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L30 HW Event Registration Form</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background: lightyellow;
                text-align: center;
                padding: 30px;
            }

            h1 {
                color: green;
            }

            input {
                padding: 8px;
                margin: 5px;
                border: 2px solid green;
                border-radius: 6px;
                width: 220px;
            }

            button {
                background: green;
                color: white;
                padding: 10px 25px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
            }

            #timer {
                color: darkolivegreen;
            }
        </style>
    </head>
    <body>
        <h1>Event Registration Form</h1>
        <p>Enter your details here!</p>

        <input type="text" id="name" placeholder="Your name" required><br>
        <p id="msg-name"></p>

        <input type="number" id="grade" placeholder="Your grade (1 to 12)" min="1" max="12" required><br>
        <p id="msg-grade"></p>

        <button onclick="checkForm()">Try My Luck!</button>
        <p id="result"></p>
        <p id="timer"></p>

        <script>
            var seconds = 0;

            setInterval(function(){
                seconds = seconds + 1;
                document.getElementById("timer").textContent = "You have been here for " + seconds + " seconds!";
            }, 1000);


            function checkForm() {
                var name = document.getElementById("name").value;
                var grade = document.getElementById("grade").value;
                var ok = true;


                if (name == "") {
                    document.getElementById("msg-name").textContent = "Please enter your name!";
                    document.getElementById("msg-name").style.color = "red";
                    ok = false; 
                }
                else {
                    document.getElementById("msg-name").textContent = "Great name!";
                    document.getElementById("msg-name").style.color = "green";
                }


                if (grade == "" || grade < 1 || grade > 12) {
                    document.getElementById("msg-grade").textContent = "Please enter your grade";
                    document.getElementById("msg-grade").style.color = "red";
                    ok = false;
                }


                else {
                    document.getElementById("msg-grade").textContent = "Grade saved!";
                    document.getElementById("msg-grade").style.color = "green";
                }


                if (ok == true) {
                    document.getElementById("result").textContent = "Please wait...";
                    document.getElementById("result").style.color = "navy";


                    setTimeout(function(){
                        var lucky = Math.floor(Math.random() * 1000) + 1;
                        document.getElementById("result").textContent = "Event Pass: " + lucky;
                        document.getElementById("result").style.color = "green";
                    }, 2000);
                }
            }
            </script>
    </body>
</html>
