<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L26 HW My Superhero Power Cards</title>

        <!-- Internal CSS -->
        <style>
            body {
                font-family:Arial, Helvetica, sans-serif;
                background: #f0f4ff;
                padding: 30px;
                text-align: center;
            }

            h1 {
                color: #ff5a43;
            }

            p {
                color: #555;
            }

            .cards {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 25px;
            }

            .card {
                background: white;
                border: 3px solid #ff5a43;
                border-radius: 12px;
                padding: 20px;
                width: 200px;
            }

            .planet-name {
                font-size: 22px;
                font-weight: bold;
                color: #333;
            }

            .planet-fact {
                color: #666;
                margin-top: 10px;
                font-size: 14px;
            }

            button {
                background: #ff5a43;
                color: white;
                border: none;
                padding: 12px 28px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 16px;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <h1>My Superhero Power Cards</h1>
        <p>Use a JavaScript class to build superhero power cards!</p>

        <button onclick="showSuperheroes()">Show Superheroes!</button>

        <div class="cards">
            <div id="card1"></div>
            <div id="card2"></div>
            <div id="card3"></div>
        </div>

        <script>
            class Superhero {
                constructor(nm,fct) {
                    this.name = nm;
                    this.fact = fct;
                }

                describe () {
                    return this.name + ": " + this.fact;
                }
            }

            function showSuperheroes() {
                let p1 = new Superhero("Spiderman", "The young man who gained superhuman abilities after being bitten by a spider and fights crime in New York City");
                let p2 = new Superhero("Ironman", "He saved the universe by using the Infinity Stones to defeat Thanos in Avengers: Endgame.");
                let p3 = new Superhero("Hulk", "A genetics researcher with a tragic past, suffers a lab accident that makes him transform into a raging, giant green monster when angered.");

                document.getElementById("card1").innerHTML =
                    "<div class='card'><div class='superhero-name'>" + p1.name + "</div>" +
                    "<div class='superhero-fact'>" + p1.describe() + "</div></div>";

                document.getElementById("card2").innerHTML = 
                    "<div class='card'><div class='superhero-name'>" + p2.name + "</div>" +
                    "<div class='superhero-fact'>" + p2.describe() + "</div></div>";
                
                document.getElementById("card3").innerHTML = 
                "<div class='card'><div class='superhero-name'>" + p3.name + "</div>" +
                "<div class='superhero-fact'>" + p3.describe() + "</div></div>";
            }
        </script>
    </body>
</html>
