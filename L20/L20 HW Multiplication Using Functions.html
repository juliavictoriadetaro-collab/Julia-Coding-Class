<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>L20 HW Multiplication Using Functions</title>
    </head>
    <body>
        <button onclick="mulitply(4)">Click Me!</button>
        <p id="result"></p>

        <script>
            function mulitply(a,b)
            {
                    if (b === undefined)
                {
                    alert ("The value of b is undefined");
                    b=5;
                }

                var result = a * b;
                document.getElementById("result").innerHTML = result;
            }
        </script>
    </body>
</html>
