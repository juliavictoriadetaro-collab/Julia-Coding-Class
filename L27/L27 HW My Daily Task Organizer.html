<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L27 HW My Daily Task Organizer</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background: lightgoldenrodyellow;
        }

        h1, h3 {
            color: burlywood;
        }

        .box {
            background: white;
            color: burlywood;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="mb-1">My Daily Task Organizer</h1>

    <p class="text-muted mb-4">
        Sort and label your daily tasks using JavaScript array methods!
    </p>

    <!-- Topic 1 & 2: sort() and reverse() -->
    <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title">Daily Tasks</h3>

            <button class="btn btn-primary mr-2" onclick="sortAZ()">Sort A to Z</button>

            <button class="btn btn-primary" onclick="sortZA()">Sort Z to A</button>

            <div id="nameResult" class="box p-3 mt-3 rounded"></div>
        </div>
    </div>

    <!-- Topic 3: sort() with compare function-->
    <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title">Every Task Counts</h3>

            <button class="btn btn-primary mr-2" onclick="sortLeast()">Least Amount Of Times Done</button>

            <button class="btn btn-primary" onclick="sortMost()">Most Amount Of Times Done</button>

            <div id="countResult" class="box p-3 mt-3 rounded"></div>
        </div>
    </div>

    <!-- Topic 4 -->
    <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title">Task Count</h3>

            <button class="btn btn-primary" onclick="addLabel()">Tasks Left</button>

            <div id="labelResult" class="box p-3 mt-3 rounded"></div>
        </div>
    </div>
</div>
<script>
    var tasks = [
        "Washing Dishes",
        "Fixing Bed",
        "Cooking",
        "Watering The Plants",
        "Brushing The Floor"
    ];

    var count = [15, 8, 10, 6, 4];

    document.getElementById("nameResult").innerHTML =
        "Tasks:<br>" + tasks.join("<br>");

    document.getElementById("countResult").innerHTML =
        "Count:<br>" + count.join("<br>");

    document.getElementById("labelResult").innerHTML =
        "Press the button above!";

    function sortAZ() {
        tasks.sort();
        document.getElementById("nameResult").innerHTML =
            "A to Z:<br>" + tasks.join("<br>");
    }

    function sortZA() {
        tasks.sort();
        tasks.reverse();
        document.getElementById("nameResult").innerHTML =
            "Z to A:<br>" + tasks.join("<br>");
    }

    function sortLeast() {
        count.sort(function(a, b) {
            return a - b;
        });
        document.getElementById("countResult").innerHTML =
            "Least Amount Of Times Done:<br>" + count.join("<br>");
    }

    function sortMost() {
        count.sort(function(a, b) {
            return b - a;
        });
        document.getElementById("countResult").innerHTML =
            "Most Amount Of Times Done:<br>" + count.join("<br>");
    }

    function addLabel() {
        var labels = count.map(function(c) {
            return c + " tasks";
        });
        document.getElementById("labelResult").innerHTML =
            "Labelled:<br>" + labels.join("<br>");
    }
</script>
</body>
</html>
