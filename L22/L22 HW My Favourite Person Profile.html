<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Person</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #F0F0F2;
        }

        h1 {
            color: #FF5A43;
        }

        .card-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="py-4">
    <div class="container">
        <h1 class="mb-1">My Favorite Person</h1>
        <p class="text-muted mb-4">
            Introduction to Objects in JavaScript - Grade 4-6
        </p>

        <!-- Favorite Person Card -->
        <div class="card shadow-sm mb-3" style="max-width: 400px;">
            <div class="card-body">
                <h5 class="card-title" style="color:#FF5A43;">
                    My Favorite Person Details
                </h5>

                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <span class="card-label d-block">Name</span>
                        <strong id="name">-</strong>
                    </li>

                    <li class="list-group-item">
                        <span class="card-label d-block">Country</span>
                        <strong id="country">-</strong>
                    </li>

                    <li class="list-group-item">
                        <span class="card-label d-block">Occupation</span>
                        <strong id="occupation">-</strong>
                    </li>

                    <li class="list-group-item">
                        <span class="card-label d-block">Favorite Colour</span>
                        <strong id="colour">-</strong>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Step 1 - Create the object
        var myContact = {
            name: "Claude Monet",
            country: "France",
            occupation: "French Painter",
            favouriteColour: "Blue and Yellow"
        };

        // Step 2 - Dot notation
        var nameEl = document.getElementById("name");
        var countryEl = document.getElementById("country");

        nameEl.textContent = myContact.name;
        countryEl.textContent = myContact.country;

        // Step 3 - Bracket notation
        var occupationEl = document.getElementById("occupation");
        var colourEl = document.getElementById("colour");

        occupationEl.textContent = myContact["occupation"];
        colourEl.textContent = myContact["favouriteColour"];
    </script>
</body>
</html>
